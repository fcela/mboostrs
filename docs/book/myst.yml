# MyST / Jupyter Book 2.x configuration.
# Chapter sources are executable notebooks; the capability appendix is a
# generated, markdown-only notebook.
#   cd docs/book
#   python3 generate_figures.py     # methodology figures (SVG)
#   bash build-pdf.sh               # full-book PDF (pdflatex + bibtex)
#   bash build-html.sh              # website -> _build/html (executes all cells)
#   bash start.sh                   # local preview, with the cells run
#
# No notebook here stores its outputs -- they would go stale in git, and
# check_examples.py refuses them -- so the outputs a reader sees are produced
# by the build. `myst start` on its own does not execute (the flag defaults to
# false), and every code cell then renders with nothing under it. Pass
# --execute from a shell with the docs environment active, or use start.sh to
# activate the repository environment and check its Python/native build first.
version: 1
project:
