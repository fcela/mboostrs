[package]
name = "mboostrs-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 Python bindings for mboostrs-core"
# PyO3 extension module (cdylib); distributed as a PyPI wheel, not a crates.io
# crate. Guard against accidental `cargo publish`.
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib"]

[features]
hessboost = ["mboostrs-core/hessboost"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = "0.17"
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1.10"
mboostrs-core = { path = "../mboostrs-core" }
