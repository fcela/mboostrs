name: R parity evidence

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: Parity scope to execute
        required: true
        default: full
        type: choice
        options:
          - full
          - focused
  pull_request:
    branches: [main]
    paths:
      - "crates/mboostrs-core/src/**"
      - "crates/mboostrs-py/**"
      - "python/mboostrs/families.py"
      - "python/mboostrs/learners.py"
      - "python/mboostrs/glmboost.py"
      - "python/mboostrs/gamboost.py"
      - "python/mboostrs/gamlss.py"
      - "python/mboostrs/cvrisk.py"
      - "python/mboostrs/stabsel.py"
      - "python/mboostrs/folds.py"
      - "python/mboostrs/_weights.py"
      - "python/mboostrs/_refit.py"
      - "python/mboostrs/transforms.py"
      - "python/mboostrs/_criteria.py"
      - "python/mboostrs/_likelihood.py"
      - "python/mboostrs/diagnostics.py"
      - "python/mboostrs/model_selection.py"
      - "python/mboostrs/conformal.py"
      - "python/mboostrs/explore.py"
      - "python/mboostrs/capability_manifest.json"
      - "mboostrs/R/**"
      - "tests/**/*parity*.py"
      - "tests/test_gamlss_parity/**"
      - "tests/test_predict_parity/**"
      - "tests/test_cvrisk_parity/**"
      - "tests/test_stabsel_parity/**"
      - "tests/parity_focus.json"
      - "tools/parity_ledger.py"
      - "tools/run_parity.py"
      - ".github/workflows/parity.yml"

permissions:
  contents: read

concurrency:
  group: parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: ${{ github.event_name == 'pull_request' && 'Focused parity' || 'Parity ledger' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PARITY_SCOPE: ${{ github.event_name == 'pull_request' && 'focused' || (github.event_name == 'schedule' && 'full' || inputs.scope) }}
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: parity

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R parity dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: mboostrs
          extra-packages: |
            mboost@2.9-11
            gamlss.dist@6.1-1
            any::gamboostLSS
            any::stabs
            any::survival
            any::partykit
            any::TH.data
            any::jsonlite

      - name: Build and install mboostrs with parity dependencies
        run: |
          python -m pip install maturin pytest rpy2 jsonschema pandas scikit-learn
          maturin build --release --out dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Validate capability and focused-node contracts
        run: |
          python tools/generate_capabilities.py --check
          python -m pytest tests/test_parity_ledger.py -q

      - name: Run ${{ env.PARITY_SCOPE }} parity scope
        run: >-
          python tools/run_parity.py
          --scope "${PARITY_SCOPE}"
          --output artifacts/parity-results.json
          --require-dependencies
          -- -q -ra

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-${{ env.PARITY_SCOPE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/parity-results.json
            artifacts/parity-summary.md
          if-no-files-found: warn
          retention-days: 90
