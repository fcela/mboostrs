name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-language:
    name: Correctness-gated R comparison
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-language-benchmarks

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R benchmark dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: mboostrs
          extra-packages: |
            any::mboost
            any::stabs
            any::survival

      - name: Build benchmark wheel
        run: |
          python -m pip install maturin pytest rpy2 jsonschema memray
          maturin build --release --out dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Validate benchmark contracts
        run: >-
          python -m pytest
          tests/test_benchmark_allocation_profilers.py
          tests/test_benchmark_contract.py
          tests/test_benchmark_python.py
          tests/test_benchmark_thread_scaling.py
          tests/test_profile_memory.py -q

      - name: Run equal-boundary comparisons
        run: |
          python benches/bench_all.py --thread-mode single --output artifacts/benchmark-single.json
          env -u RAYON_NUM_THREADS python benches/bench_all.py --thread-mode default --output artifacts/benchmark-default.json
          python benches/bench_python.py --output artifacts/benchmark-python.json
          python benches/bench_thread_scaling.py --output artifacts/benchmark-thread-scaling.json
          python benches/profile_memory.py --output artifacts/profile-memory.json

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/benchmark-single.json
            artifacts/benchmark-single.md
            artifacts/benchmark-default.json
            artifacts/benchmark-default.md
            artifacts/benchmark-python.json
            artifacts/benchmark-thread-scaling.json
            artifacts/profile-memory.json
            benches/scenarios.json
            docs/schemas/benchmark-result.schema.json
            docs/schemas/profile-memory-result.schema.json
          if-no-files-found: warn
          retention-days: 90

  criterion:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks

      - name: Run core benchmarks
        run: |
          cargo bench -p mboostrs-core
          cargo run --release -p mboostrs-core --example allocation_probe > allocation-result.json

      - name: Upload Criterion report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-report
          path: |
            target/criterion/
            allocation-result.json
            docs/schemas/allocation-result.schema.json
          if-no-files-found: ignore
