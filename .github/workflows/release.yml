# Release: publish to crates.io and PyPI on version tags.
#
# Triggered by a push of a tag matching v* (e.g. v0.1.0, v0.2.0-rc1).
# Creates a GitHub release, publishes mboostrs-core to crates.io, and
# publishes wheels to PyPI for:
#   - macOS arm64 + x86_64 (universal2)
#   - Linux x86_64 (manylinux)
#   - Windows x86_64
# across Python 3.11, 3.12, 3.13.
#
# All generally tagged wheels use Rust's portable target baseline. Local
# target-cpu=native benchmark flags must never enter this workflow.

name: Release

on:
  push:
    tags: ["v*"]
  # Build and verify artifacts without publishing or creating a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The capability ledger's review-date rule and the benchmark
          # artifact report read the commit history; a shallow clone makes
          # every file look changed by the newest commit.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: mboostrs
          extra-packages: |
            any::rcmdcheck
            mboost@2.9-11
            gamlss.dist@6.1-1
            any::gamboostLSS
            any::stabs
            any::survival
      - name: Build and install the exact Python artifact
        # `plot` is needed by tests/test_plot.py at collection.
        run: |
          python -m pip install maturin
          maturin build --release --out dist
          for wheel in dist/*.whl; do
            python -m pip install --force-reinstall "${wheel}[dev,sklearn]"
            python -m pip install "${wheel}[plot]"
          done
      - name: Build the extension into the source tree
        # The generated-file checks in tools/ import `mboostrs._rust` from
        # python/, so the compiled module must sit beside the sources. It is
        # copied from the wheel installed above.
        run: python tools/install_extension_in_source.py
      - name: Verify source, bindings, generated contracts, and examples
        run: |
          cargo fmt --check --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python tools/generate_rust_stub.py --check
          python tools/generate_capabilities.py --check
          python tools/generate_api_reference.py --check
          python tools/check_surfaces_agree.py
          python tools/check_front_door.py
          python -m pytest -m "not r_parity" -q
      - name: Verify the R package
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: mboostrs
          args: 'c("--no-manual", "--as-cran")'

  # ── Build wheels (all platforms) ──────────────────────────────────────
  build-wheels:
    name: Build wheels — ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: universal2 wheel covering both arm64 (Apple Silicon)
          # and x86_64 (Intel) in a single .whl file.
          - label: macOS universal2
            os: macos-14
            target: universal2-apple-darwin
            arch: universal2
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Linux x86_64: built inside a manylinux Docker container for
          # glibc compatibility across distributions.
          - label: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            manylinux: manylinux2014
            rust_targets: x86_64-unknown-linux-gnu
          # Windows x86_64
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            rust_targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The extension is built per interpreter (no abi3), so the wheels for
      # every supported minor version are built here. The manylinux container
      # carries its own interpreters; the other runners need them on PATH.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.11 python3.12 python3.13
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Install and smoke-test the built wheel
        shell: bash
        run: |
          ls dist
          python -m pip install --force-reinstall --find-links dist mboostrs
          python -c "import mboostrs as mb; d={'x':[0.,1.,2.],'y':[0.,1.,2.]}; m=mb.glmboost('y ~ x',d,control=mb.boost_control(2)); assert m.predict().shape == (3,)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          path: dist/

  # ── Build sdist ───────────────────────────────────────────────────────
  build-sdist:
    name: Build sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/

  test-sdist:
    name: Install and exercise the source distribution
    needs: build-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/
      - name: Install source artifact without the repository checkout
        run: python -m pip install dist/*.tar.gz
      - name: Exercise the installed source artifact
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import numpy as np
          import polars as pl
          import mboostrs as mb

          x = np.linspace(-1, 1, 80)
          data = pl.DataFrame({"x": x, "y": 2*x + .1*np.sin(4*x)})
          fit = mb.gamboost("y ~ bols(x)", data, control=mb.boost_control(30))
          assert np.isfinite(fit.predict(newdata=data)).all()
          cv = fit.cvrisk(B=3)
          assert cv.optimal_mstop > 0
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "model"
              mb.save_model(fit, path)
              restored = mb.load_model(path)
              np.testing.assert_allclose(restored.predict(newdata=data), fit.predict(newdata=data))
          PY

  # ── crates.io ─────────────────────────────────────────────────────────
  crates-io:
    name: Publish mboostrs-core to crates.io
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish mboostrs-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mboostrs-core

  # ── PyPI ──────────────────────────────────────────────────────────────
  pypi:
    name: Publish wheels to PyPI
    needs: [build-wheels, build-sdist, test-sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: PyPI accepts the workflow's OIDC identity, so no
    # API token secret is stored in the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # ── GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub release
    needs: [pypi, crates-io]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate release notes from changelog
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if python3 tools/release_notes.py "${VERSION}" CHANGELOG.md > _release_notes.md \
            && [ -s _release_notes.md ]; then
            :
          else
            echo "Release mboostrs v${VERSION}" > _release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: _release_notes.md
          generate_release_notes: false
