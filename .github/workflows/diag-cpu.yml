name: Diagnose CPU-dependent tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Build and install
        run: |
          python -m pip install maturin
          maturin build --release --out dist
          python -m pip install "$(ls dist/*.whl)[dev,sklearn]"
      - name: Report
        run: |
          lscpu | grep -E "Model name|Flags" | sed 's/Flags:.*\(avx512[a-z]*\).*/Flags: has avx512/' | cut -c1-120
          grep -o -m1 "avx512f" /proc/cpuinfo || echo "no avx512f"
          grep -o -m1 " fma " /proc/cpuinfo || echo "no fma"
          cat > /tmp/d.py <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import numpy as np
          from test_gamlss_refit_small_n import _fit_and_refit
          r = _fit_and_refit(80, 0)
          print("CONV", r.convergence)
          print("EDF", r.edf["sigma"])
          print("REML", r.reml_score)
          PY
          MBOOSTRS_TRACE_REML=1 python /tmp/d.py 2>&1 | tail -40
          cat > /tmp/e.py <<'PY'
          import sys, warnings
          sys.path.insert(0, "tests")
          import numpy as np
          import mboostrs as mb
          from mboostrs import direct_gam
          from mboostrs.selection import gam_refit
          import test_direct_reml_gam as t
          data = t._data()
          f = t.FORMULA
          warnings.simplefilter("ignore")
          boosted = mb.gamboost(f, data=data, family=mb.Gaussian(), control=mb.boost_control(mstop=5, nu=0.1))
          refit = gam_refit(boosted, which="all")
          direct = direct_gam.gam(f, data)
          d = np.abs(direct.coef()["estimate"].to_numpy() - refit.coef()["estimate"].to_numpy())
          print("T1 maxdiff", d.max(), "reml", direct.reml_score, refit.reml_score)
          print("T1 direct conv", direct.convergence)
          print("T1 refit conv", refit.convergence)
          print("T1 lambda direct", {k: v for k, v in direct.lambda_.items()} if hasattr(direct, "lambda_") else "n/a")
          PY
          MBOOSTRS_TRACE_REML=1 python /tmp/e.py 2>&1 | grep -E "^T1|reml stop|reml start" | cut -c1-300
          python -m pytest tests/test_direct_reml_gam.py::test_direct_fit_matches_gam_refit_on_the_same_terms "tests/test_gamlss_refit_small_n.py::test_refit_converges_and_shrinks_the_null_smooth" -q -p no:cacheprovider 2>&1 | tail -4
