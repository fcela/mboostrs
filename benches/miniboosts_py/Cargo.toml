# A thin Python binding to the miniboosts crate (binary-classification
# boosting, Mitsuboshi), used only as a benchmark competitor. Not part of the
# mboostrs workspace.
[package]
name = "miniboosts_py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "miniboosts_py"
crate-type = ["cdylib"]

[dependencies]
miniboosts = "0.4.0"
pyo3 = { version = "0.23", features = ["extension-module"] }

[workspace]
